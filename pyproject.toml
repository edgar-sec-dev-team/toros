[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "toros"
version = "0.0.1"
description = "undeclared"
authors = [
    "Nikhil Sunder <nsunder724@gmail.com>",
    "Jake Schultz <jakeschultz28@gmail.com>",
    "John Bernardin <john.bernardin@example.com>",
    "Rayhan Rahman <rayhan.rahman@example.com>"
]
readme = "README.md"
license = "MIT"
repository = "https://github.com/edgar-sec-dev-team/toros"
documentation = "https://edgar-sec-dev-team.github.io/toros"
packages = [{include = "toros", from = "src"}]
include = ["src/toros/py.typed"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment"
]
keywords = [
    "fred", "federal reserve", "api", "economics", "finance", "economic data", "financial data",
    "fred pandas", "fred polars", "fred dask", "fred geopandas", "async", "pandas", "polars",
    "dask", "geopandas", "cache", "financial analysis", "economic analysis", "data analysis",
    "data science", "data visualization", "data mining", "data wrangling", "data cleaning"
]

[tool.poetry.dependencies]
python = ">=3.10, <4.0"
httpx = "*"
cachetools = "*"
asyncache ="*"
tenacity = "*"
pandas = "*"
geopandas = "*"

[tool.poetry.group.dev.dependencies]
pandas = "*"

[tool.mypy]
files = "toros"
ignore_missing_imports = true

[tool.pylint]
max-line-length = 200
disable = ["C0415", "C2801", "C0114", "C0115", "C0116", "C0302", "C0301", "E0401", "R0902", "R0913", "R0917", "R0914", "R0912", "R0904", "R1705", "C0103", "R1710", "W0603", "R0911"]
ignore-patterns = [".*\\.pyi$"]

[tool.bandit]
exclude_dirs = ["tests", "docs"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
pythonpath = "src"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]